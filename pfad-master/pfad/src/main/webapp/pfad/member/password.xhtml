<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:o="http://omnifaces.org/ui"
                xmlns:pass="http://xmlns.jcp.org/jsf/passthrough" xmlns:p="http://primefaces.org/ui" template="/resources/scaffold/pageTemplate.xhtml">

	<f:metadata>
		<f:viewAction action="#{memberBean.setCurrentMember()}" />
	</f:metadata>

	<ui:define name="header">
		Passwort
	</ui:define>

	<ui:define name="footer" />

	<ui:define name="main">
		<h:panelGrid columns="2" rendered="#{!empty memberBean.validationResults}">
			<ui:repeat value="#{memberBean.validationResults}" var="vr">
				<h:outputLabel value="ACHTUNG:" styleClass="error"/>
				<h:outputText value="#{vr.message}" styleClass="error"/>
			</ui:repeat>
		</h:panelGrid>

		<h:form id="password">

			<p:growl id="growl"/>
			<p:focus/>

			<h:panelGrid columnClasses="label2,component2,label2,component2l" columns="4">

				<h:outputLabel for="memberBeanMemberBVKey" value="BV Key:" />
				<h:outputText id="memberBeanMemberBVKey" value="#{memberBean.member.BVKey}" />
				<h:outputLabel for="memberBeanMemberLogin" value="Login:" />
				<h:outputText id="memberBeanMemberLogin" value="#{memberBean.member.login} : #{memberBean.member.rolesString}" />

				<h:outputLabel for="memberBeanMemberAnrede" value="Anrede:" />
				<h:outputText id="memberBeanMemberAnrede" value="#{memberBean.member.anrede}" />

				<h:outputLabel for="memberBeanMemberTitel" value="Titel:" />
				<h:outputText id="memberBeanMemberTitel" value="#{memberBean.member.titel}" />

				<h:outputLabel for="memberBeanMemberName" value="Name:" />
				<h:outputText id="memberBeanMemberName" value="#{memberBean.member.name}" />

				<h:outputLabel for="memberBeanMemberVorname" value="Vorname:" />
				<h:outputText id="memberBeanMemberVorname" value="#{memberBean.member.vorname}" />

				<h:outputLabel for="memberBeanMemberOldPassword" value="Akt.Passwort:" />
				<h:inputSecret id="memberBeanMemberOldPassword" value="#{memberBean.oldPassword}" required="true" autocomplete="false" style="width: 20em" >
					<f:ajax/>
				</h:inputSecret>
				<h:outputText/>
				<h:outputText/>

				<h:outputLabel for="memberBeanMemberPassword" value="Passwort:" />
				<h:inputSecret id="memberBeanMemberPassword" value="#{memberBean.newPassword}" validator="#{memberBean.validatePasswords}" autocomplete="false" style="width: 20em" >
					<f:ajax event="keyup" render="button"/>
					<f:ajax render="button"/>
				</h:inputSecret>
				<h:outputText/>
				<h:outputText/>

				<h:outputLabel for="memberBeanMemberPasswordCheck" value="Wiederholung:" />
				<h:inputSecret id="memberBeanMemberPasswordCheck" value="#{memberBean.newPasswordCheck}" validator="#{memberBean.validatePasswords}" autocomplete="false" style="width: 20em" >
					<f:ajax event="keyup" render="memberBeanMemberPasswordCheckMessage button"/>
					<f:ajax execute="@this" render="memberBeanMemberPasswordCheckMessage button"/>
				</h:inputSecret>
				<h:message id="memberBeanMemberPasswordCheckMessage" for="memberBeanMemberPasswordCheck"/>
				<h:outputText/>

				<p:commandButton id="button" value="Passwort ändern" disabled="#{memberBean.oldPassword == null || memberBean.newPassword == null || !memberBean.newPasswordsMatch}"
					process="@form" actionListener="#{memberBean.changePassword()}" update="@form"/>

			</h:panelGrid>

		</h:form>

	</ui:define>

</ui:composition>
